# SigNoz Foundry casting for Notch.
#
# This describes the SigNoz deployment Notch's Observatory is built against, so a
# judge can reproduce it with Foundry instead of trusting a screenshot. It is the
# same stack scripts/signoz-up.sh brings up by hand: ZooKeeper and ClickHouse for
# storage, the SigNoz OTel collector as the ingest path, and the SigNoz UI.
#
# Image versions are pinned to what actually ran while the screenshots in
# docs/screenshots/ were captured — read off `docker ps` on that machine, not
# copied from an example file. The one exception is called out below.
#
# What Notch needs from this deployment:
#   - OTLP/HTTP on :4318 — the daemon exports traces, metrics and logs there
#     (NOTCH_OTEL_ENDPOINT, default http://localhost:4318)
#   - ClickHouse on :8123 — the Observatory queries its own spans back out
#     (Triage, Health, Logs, Metric Explorer, Trace Waterfall)
#   - The UI on :8080 — "View in SigNoz" deep links point here. This is Notch's
#     built-in default (src/daemon/server.ts), so a fleet pointed at a Foundry
#     cast needs no NOTCH_SIGNOZ_URL at all. scripts/signoz-up.sh uses 8085
#     instead because it is meant to coexist with whatever else is on 8080.
apiVersion: v1alpha1

metadata:
  name: notch-observability
  annotations:
    # Free-text provenance, so whoever re-runs this knows what it was for.
    notch.dev/project: "https://github.com/nickthelegend/notch"
    notch.dev/purpose: "Agent-fleet observability — traces, metrics and logs for Notch"
    notch.dev/otlp-endpoint: "http://localhost:4318"
    notch.dev/ui-url: "http://localhost:8080"

spec:
  deployment:
    mode: docker
    flavor: compose

  # The UI and query service. Pinned to the 0.134 line: this is the version the
  # provisioning code in src/core/signoz-provision.ts was written against, and
  # that version matters — its login is POST /api/v2/sessions/email_password and
  # requires an orgID, and its alert rules need version "v5" with a
  # condition.compositeQuery.queries array rather than builderQueries. An older
  # or newer SigNoz will reject those payloads.
  signoz:
    spec:
      enabled: true
      image: signoz/signoz:v0.134.0

  # The OTel collector — this is the address Notch exports to. Everything the
  # Observatory reads back entered through here first.
  ingester:
    spec:
      enabled: true
      image: signoz/signoz-otel-collector:v0.142.0

  # ClickHouse. Notch queries this directly for the read-back features, so the
  # schema version is load-bearing: signoz_logs.distributed_logs_v2 stores
  # timestamps in nanoseconds and lowercase-hex trace ids, and metrics need
  # distributed_samples_v4 joined to distributed_time_series_v4 on fingerprint.
  telemetrystore:
    spec:
      enabled: true
      image: clickhouse/clickhouse-server:25.12.5
      cluster:
        replicas: 1
        shards: 1

  # ZooKeeper, which ClickHouse needs for its distributed tables.
  telemetrykeeper:
    kind: zookeeper
    spec:
      enabled: true
      image: signoz/zookeeper:3.7.1

  # Forge does not publish ClickHouse's HTTP port by default, and Notch needs it
  # from the host: Triage, Health, Logs, the Metric Explorer and the Trace
  # Waterfall all query ClickHouse directly rather than going through the SigNoz
  # API. Without this the stack ingests happily and every read-back view reports
  # "unavailable" — which is the honest failure, but not a working demo.
  patches:
    - target: "deployment/compose.yaml"
      operations:
        - op: add
          path: /services/notch-observability-telemetrystore-clickhouse-0-0/ports
          value:
            - "8123:8123"
            - "9000:9000"

